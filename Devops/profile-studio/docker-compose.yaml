services:
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/profile_studio
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    volumes:
      - profile-studio-data:/data/db

volumes:
  profile-studio-data:
    external: true